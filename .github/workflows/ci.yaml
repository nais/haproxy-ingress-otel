name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to run CI on'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NAME: haproxy-ingress-otel
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================================
  # Stage 0: Load versions from versions.env (single source of truth)
  # ============================================================================
  versions:
    name: Load Versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      haproxy_ingress: ${{ steps.versions.outputs.HAPROXY_INGRESS_VERSION }}
      haproxy: ${{ steps.versions.outputs.HAPROXY_VERSION }}
      s6_overlay: ${{ steps.versions.outputs.S6_OVERLAY_VERSION }}
      rust: ${{ steps.versions.outputs.RUST_VERSION }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4
        with:
          sparse-checkout: versions.env
          sparse-checkout-cone-mode: false

      - name: Read versions.env
        id: versions
        run: |
          while IFS='=' read -r key value; do
            [[ -z "$key" || "$key" =~ ^# ]] && continue
            echo "${key}=${value}" >> $GITHUB_OUTPUT
          done < versions.env

  # ============================================================================
  # Stage 1: Version check (parallel with lint)
  # ============================================================================
  check-versions:
    name: Check Version Sync
    runs-on: ubuntu-latest
    needs: versions
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # ratchet:jdx/mise-action@v2
        with:
          install: false

      - name: Verify versions match
        run: mise run check-versions

  # ============================================================================
  # Stage 1: Lint (parallel with check-versions, fast feedback)
  # ============================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: [versions]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # ratchet:jdx/mise-action@v2

      - name: Install Rust components
        run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # ratchet:Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Lint
        run: |
          sed -i 's/, "tests"//' Cargo.toml
          sed -i 's/"tests", //' Cargo.toml
          mise run lint

  # ============================================================================
  # Stage 2: Tests (parallel after lint and check-versions pass)
  # ============================================================================
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [versions, check-versions, lint]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # ratchet:jdx/mise-action@v2

      - name: Install HAProxy with Lua
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends software-properties-common
          sudo add-apt-repository ppa:vbernat/haproxy-${{ needs.versions.outputs.haproxy }} -y
          sudo apt-get install haproxy=${{ needs.versions.outputs.haproxy }}.\*

      - uses: Swatinem/rust-cache@82a92a6e8fbeee089604da2575dc567ae9ddeaab # ratchet:Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests
        run: mise run test

  docker-test:
    name: Docker Module Test
    runs-on: ubuntu-latest
    needs: [versions, check-versions, lint]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # ratchet:docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # ratchet:docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: haproxy-ingress-otel:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Verify OTEL module
        run: |
          OUTPUT=$(docker run --rm --user root --entrypoint sh \
            -e OTEL_SERVICE_NAME=test-service \
            -e OTEL_EXPORTER_OTLP_ENDPOINT=http://localhost:4318 \
            haproxy-ingress-otel:test -c '
            cat > /tmp/test.cfg << "EOF"
          global
              tune.lua.bool-sample-conversion pre-3.1-bug
              master-worker
              insecure-fork-wanted
              lua-load-per-thread /etc/haproxy/lua/otel.lua

          defaults
              mode http
              timeout connect 5s
              timeout client 5s
              timeout server 5s

          frontend test
              bind :8080
              http-request lua.start_server_span
              filter lua.opentelemetry-trace
              default_backend default

          backend default
              server srv1 127.0.0.1:8081
          EOF
          haproxy -c -f /tmp/test.cfg 2>&1
          ')
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "OpenTelemetry initialized" || exit 1

  e2e:
    name: E2E Test
    runs-on: ubuntu-latest
    needs: [versions, check-versions, lint]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # ratchet:actions/checkout@v4

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # ratchet:jdx/mise-action@v2
        with:
          install: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # ratchet:docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # ratchet:docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: haproxy-ingress-otel:test
          cache-from: type=gha
          platforms: linux/amd64

      - name: Run E2E tests
        run: BUILD=0 PLATFORM=linux/amd64 mise run e2e

      - name: Cleanup
        if: always()
        run: docker compose -f e2e/docker-compose.yaml down -v 2>/dev/null || true

  # ============================================================================
  # Stage 3: Push manifest (only on main, after all tests pass)
  # ============================================================================
  nais_push:
    name: Push Nais image
    runs-on: ubuntu-latest
    needs: [versions, unit-test, docker-test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # ratchet:actions/checkout@v7.0.0

      - uses: nais/platform-build-push-sign@df590279b21bc5978519685752f9eaddd546043c # ratchet:nais/platform-build-push-sign@main
        id: build-push-sign
        with:
          name: ${{ env.NAME }}
          google_service_account: gh-${{ env.NAME }}
          workload_identity_provider: ${{ secrets.NAIS_IO_WORKLOAD_IDENTITY_PROVIDER }}
          push: true
